openapi: 3.1.0
info:
  title: Stray API
  version: "1"
  description: |
    A record of Hyperliquid perp markets: order-book depth, funding, open interest, flow, whale positioning and
    liquidation levels, plus the same markets on Binance, Bybit and OKX. Responses are JSON; times are UTC;
    fractions are decimals (-0.1379 = -13.79%). Everything describes the past or the present, not a forecast.
    Full reference: https://stray.fi/docs
  license: { name: MIT, identifier: MIT }
servers:
  - url: https://stray.fi/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API key from https://stray.fi/console (stray_...). Keys are never accepted in the URL.
  parameters:
    coin:
      name: coin
      in: path
      required: true
      description: A core market.
      schema: { type: string, enum: [BTC, ETH, HYPE, SOL, XRP, DOGE, BNB, SUI] }
    anyCoin:
      name: coin
      in: path
      required: true
      description: A core market, or a HIP-3 market by its full name (e.g. xyz:NVDA; see /markets).
      schema: { type: string }
    from:
      name: from
      in: query
      description: Start, Unix milliseconds.
      schema: { type: integer }
    to:
      name: to
      in: query
      description: End, Unix milliseconds. Default now.
      schema: { type: integer }
    step:
      name: step
      in: query
      description: Minutes between rows, 1 to 1440.
      schema: { type: integer, minimum: 1, maximum: 1440 }
  headers:
    X-Plan: { description: builder or pro, schema: { type: string } }
    X-RateLimit-Remaining: { description: Calls left this minute, schema: { type: integer } }
    X-Quota-Remaining: { description: Calls left this period, schema: { type: integer } }
  schemas:
    Error:
      type: object
      properties: { error: { type: string, description: Written to be read by a person. } }
    Bands:
      type: object
      description: US dollars resting on each side within ±x% of mid. null where the book doesn't reach the band.
      additionalProperties:
        oneOf:
          - type: object
            properties: { bids: { type: number }, asks: { type: number } }
          - type: "null"
    Series:
      type: object
      description: Rows are arrays in the order of fields.
      properties:
        fields: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array } }
  responses:
    Ok:
      description: OK
      headers:
        X-Plan: { $ref: "#/components/headers/X-Plan" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/X-RateLimit-Remaining" }
        X-Quota-Remaining: { $ref: "#/components/headers/X-Quota-Remaining" }
      content: { application/json: { schema: { type: object } } }
    Problem:
      description: "400 bad parameter, 401 bad key, 402 no active plan, 403 Pro only, 404 unknown market, 429 over a limit (see Retry-After), 502 upstream unavailable"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /markets:
    get:
      operationId: listMarkets
      summary: Markets covered, recorded HIP-3 markets, and when recording began
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /draw:
    get:
      operationId: getDraw
      summary: The Draw for the whole market (0 calm to 100 stressed), each core market's reading and their weights
      parameters: [{ $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }, { name: step, in: query, schema: { type: integer, minimum: 10, maximum: 1440, default: 10 } }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /draw/{coin}:
    get:
      operationId: getDrawForMarket
      summary: The Draw for one market, with its seven components and their inputs
      parameters: [{ $ref: "#/components/parameters/coin" }, { $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }, { name: step, in: query, schema: { type: integer, minimum: 10, maximum: 1440, default: 10 } }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /ranges/{coin}:
    get:
      operationId: getRanges
      summary: Percentiles of past moves over windows of the same length, and where the latest sits
      parameters:
        - { $ref: "#/components/parameters/coin" }
        - { name: window, in: query, description: Days, schema: { type: integer, enum: [1, 3, 7, 14, 30, 60, 90], default: 7 } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /depth/{coin}:
    get:
      operationId: getDepth
      summary: USD on each side of the live book within ±0.5%, ±1% and ±2% of mid (every 5 seconds)
      description: source is live, or record when Hyperliquid didn't answer in time and the newest recorded minute is returned (see as_of).
      parameters: [{ $ref: "#/components/parameters/anyCoin" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  coin: { type: string }
                  as_of: { type: string, format: date-time }
                  mid: { type: number }
                  usd_within: { $ref: "#/components/schemas/Bands" }
                  source: { type: string, enum: [live, record] }
        "4XX": { $ref: "#/components/responses/Problem" }
        "5XX": { $ref: "#/components/responses/Problem" }
  /history/{coin}:
    get:
      operationId: getHistory
      summary: Stray's minute-by-minute record (mark, oracle, funding, open interest, depth bands). At most 7 days per call.
      parameters: [{ $ref: "#/components/parameters/anyCoin" }, { $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }, { $ref: "#/components/parameters/step" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Series" } } } }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /stream/{coin}:
    get:
      operationId: openStream
      summary: Live Server-Sent Events (top, depth, ctx, notice). Pro plan; up to 3 streams per market per account.
      parameters: [{ $ref: "#/components/parameters/coin" }]
      responses: { "200": { description: An event stream, content: { text/event-stream: {} } }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /funding/{coin}:
    get:
      operationId: getFunding
      summary: Funding since listing and where the latest ranks against all history. At most 366 days of rows per call.
      parameters:
        - { $ref: "#/components/parameters/coin" }
        - { $ref: "#/components/parameters/from" }
        - { $ref: "#/components/parameters/to" }
        - { name: venue, in: query, schema: { type: string, enum: [hyperliquid, binance, bybit], default: hyperliquid } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /liquidity/{coin}:
    get:
      operationId: getLiquidity
      summary: Ten-minute medians of spread and USD in the top 5 and top 20 levels
      parameters: [{ $ref: "#/components/parameters/coin" }, { $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /venues/{coin}:
    get:
      operationId: getVenues
      summary: Hyperliquid, Binance, Bybit and OKX side by side (depth bands, spread, funding, open interest). Up to 7 days.
      parameters: [{ $ref: "#/components/parameters/coin" }, { $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }, { $ref: "#/components/parameters/step" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /flow/{coin}:
    get:
      operationId: getFlow
      summary: Volume by aggressor side, trade counts, largest trade, and Binance/Bybit liquidations by side. Up to 7 days.
      parameters: [{ $ref: "#/components/parameters/coin" }, { $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }, { $ref: "#/components/parameters/step" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /positioning/{coin}:
    get:
      operationId: getPositioning
      summary: Binance's 5-minute open interest, long/short accounts, top traders and taker volume. Up to 31 days.
      parameters: [{ $ref: "#/components/parameters/coin" }, { $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /crowding/{coin}:
    get:
      operationId: getCrowding
      summary: Open interest in USD per USD within ±1% of mid, every 10 minutes, with the latest percentile. Up to 7 days.
      parameters: [{ $ref: "#/components/parameters/coin" }, { $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /profile/{coin}:
    get:
      operationId: getProfile
      summary: The typical day by UTC hour (median depth, spread, volume)
      parameters:
        - { $ref: "#/components/parameters/coin" }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 7 } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /conditional/{coin}:
    get:
      operationId: getConditional
      summary: Today's funding decile and the spread of moves over the next N days after past days in it, beside all days
      parameters:
        - { $ref: "#/components/parameters/coin" }
        - { name: horizon, in: query, description: Days, schema: { type: integer, enum: [1, 3, 7, 14, 30], default: 7 } }
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /correlation:
    get:
      operationId: getCorrelation
      summary: Correlation of daily returns between the core markets
      parameters: [{ name: window, in: query, schema: { type: integer, enum: [30, 90, 180], default: 30 } }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /whales/{coin}:
    get:
      operationId: getWhales
      summary: Totals of the top 1,500 Hyperliquid accounts' positions (long, short, net, leverage, HLP). Up to 31 days.
      parameters: [{ $ref: "#/components/parameters/coin" }, { $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }, { name: step, in: query, schema: { type: integer, minimum: 10, maximum: 1440, default: 60 } }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /liqmap/{coin}:
    get:
      operationId: getLiquidationMap
      summary: Where those positions get liquidated, by distance from the mark
      parameters: [{ $ref: "#/components/parameters/coin" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /implied/{coin}:
    get:
      operationId: getImpliedVolatility
      summary: Deribit implied volatility beside realized volatility, and the one-sigma moves each implies
      parameters: [{ name: coin, in: path, required: true, schema: { type: string, enum: [BTC, ETH] } }, { $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
  /basis/HYPE:
    get:
      operationId: getHypeBasis
      summary: HYPE perp against HYPE/USDC spot in basis points, with funding, supply and spot volume. Up to 31 days.
      parameters: [{ $ref: "#/components/parameters/from" }, { $ref: "#/components/parameters/to" }, { $ref: "#/components/parameters/step" }]
      responses: { "200": { $ref: "#/components/responses/Ok" }, "4XX": { $ref: "#/components/responses/Problem" }, "5XX": { $ref: "#/components/responses/Problem" } }
